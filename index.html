<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@200,300,400,500,600,700&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@200,300,400,500,600,700&display=swap" rel="stylesheet">
   
    <meta name="language" content="French" />
    <meta name="author" content="Agoura" />
    <meta name="application-name" content="Agoura" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>Agoura | Digital Solutions & Software Development</title>
    <meta name="description" content="Agoura accompagne les entreprises dans leur transformation numérique avec des applications web, des plateformes digitales et des solutions logicielles innovantes."/>

    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="googlebot" content="index, follow" />

    <link rel="canonical" href="https://agoura.vercel.app/" />

    <!-- Theme -->
    <meta name="theme-color" content="#ff7900" />
    <!-- <meta name="color-scheme" content="light dark" /> -->

    <!-- Favicons -->
    <link rel="icon" href="./src/assets/images/logos/Favicon.png" sizes="any" />
    <link rel="icon" type="image/svg+xml+png" href="./src/assets/images/logos/Favicon.png" />
    <link rel="apple-touch-icon" href="./src/assets/images/logos/Favicon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Agoura" />

    <meta property="og:url" content="https://agoura.vercel.app/"/>
    <meta property="og:title" content="Agoura | Digital Solutions & Software Development"/>

    <meta property="og:description" content="Nous donnons vie à vos idées grâce à des solutions digitales innovantes."/>
    <meta property="og:image" content="https://agoura.vercel.app/images/org.jpg"/>
    <meta property="og:image:secure_url" content="https://agoura.vercel.app/images/org.jpg"/>

    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Agoura - Digital Solutions & Software Development"/>

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="https://agoura.vercel.app/images/org.jpg"/>
    <meta name="twitter:image:alt" content="Agoura Digital Solutions"/>

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  </head>


  <body class="">

    <script>
        (() => {
            try {
                const theme = localStorage.getItem("theme-mode");
                document.body.classList.add(theme === "dark" ? "dark" : "light");
            } catch {document.body.classList.add("light");}
        })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
